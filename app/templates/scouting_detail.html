{% extends "base.html" %}
{% set back_href, back_label = '/scouting', 'Scouting' %}
{% block title %}{{ report.opponent }} · Team Ops{% endblock %}
{% block content %}
<div class="actions-row">
  <h1>{{ report.opponent }}</h1>
  <form class="inline" method="post" action="/scouting/{{ report.id }}/delete" onsubmit="return confirm('Delete this report?')">
    <button type="submit" class="danger">Delete report</button>
  </form>
</div>

<div class="panel">
  <form method="post" action="/scouting/{{ report.id }}/edit">
    <div class="form-grid">
      <div><label>Opponent</label><input name="opponent" value="{{ report.opponent }}" required></div>
      <div>
        <label>Linked game (optional)</label>
        <select name="event_id">
          <option value="">— none —</option>
          {% for e in events %}
          <option value="{{ e.id }}" {{ 'selected' if report.event_id == e.id }}>{{ e.event_date }} — {{ e.title }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-grid wide"><div><label>Notes / tendencies</label><textarea name="content" style="min-height:220px">{{ report.content or '' }}</textarea></div></div>
    <button type="submit">Save changes</button>
  </form>
</div>
{% endblock %}
