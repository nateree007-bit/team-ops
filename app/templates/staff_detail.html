{% extends "base.html" %}
{% block title %}{{ member.name }} · Team Ops{% endblock %}
{% block content %}
<div class="actions-row">
  <h1>{{ member.name }}{% if member.role %} <span class="badge other">{{ member.role }}</span>{% endif %}</h1>
  <form class="inline" method="post" action="/staff/{{ member.id }}/delete" onsubmit="return confirm('Remove this staff member?')">
    <button type="submit" class="danger">Remove</button>
  </form>
</div>

<div class="panel">
  <h3>Edit</h3>
  <form method="post" action="/staff/{{ member.id }}/edit">
    <div class="form-grid">
      <div><label>Name</label><input name="name" value="{{ member.name }}" required></div>
      <div><label>Role</label>
        <select name="role">
          {% for r in roles %}
          <option value="{{ r }}" {{ 'selected' if member.role == r }}>{{ r }}</option>
          {% endfor %}
        </select>
      </div>
      <div><label>Phone</label><input name="phone" value="{{ member.phone or '' }}"></div>
      <div><label>Email</label><input type="email" name="email" value="{{ member.email or '' }}"></div>
      <div><label>Birthday</label><input type="date" name="birthday" value="{{ member.birthday or '' }}"></div>
    </div>
    <button type="submit">Save changes</button>
  </form>
</div>
{% endblock %}
